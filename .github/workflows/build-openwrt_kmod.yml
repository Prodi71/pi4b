name: Build OpenWrt for Raspberry Pi 4 B

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "Ветка/тег OpenWrt (например openwrt-25.12 или v25.12.5)"
        required: false
        default: "openwrt-25.12.5"
  push:
    paths:
      - ".config"
      - ".github/workflows/build-openwrt.yml"

# Полная сборка OpenWrt может занимать 1–3 часа в зависимости от
# нагрузки на раннеры GitHub — увеличиваем лимит на всякий случай.
env:
  OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'openwrt-25.12.5' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout репозитория с .config
        uses: actions/checkout@v4

      - name: Установка зависимостей сборки OpenWrt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd

      - name: Клонирование исходников OpenWrt (${{ env.OPENWRT_REF }})
        run: |
          git clone --branch "${OPENWRT_REF}" --single-branch --depth 1 \
            https://github.com/openwrt/openwrt.git openwrt-src

      - name: Кэш скачанных исходников пакетов (dl)
        uses: actions/cache@v4
        with:
          path: openwrt-src/dl
          key: openwrt-dl-${{ env.OPENWRT_REF }}-${{ hashFiles('.config') }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_REF }}-

      - name: Обновление и установка feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Применение вашего .config
        working-directory: openwrt-src
        run: cp ../.config .config

      - name: Включить ВСЕ доступные kmod-пакеты
        working-directory: openwrt-src
        run: |
          # Находим все имена модулей ядра, объявленные через
          # $(eval $(call KernelPackage,<имя>)) в дереве исходников,
          # и принудительно включаем соответствующий им символ
          # CONFIG_PACKAGE_kmod-<имя>=y. Несовместимые с bcm2711
          # варианты Kconfig сам отсеет на шаге make defconfig
          # через свои depends-условия.
          grep -rhoP '(?<=call KernelPackage,)[a-zA-Z0-9_+.-]+' \
            package/kernel target/linux 2>/dev/null \
            | sort -u > /tmp/all_kmods.txt

          echo "Найдено kmod-пакетов: $(wc -l < /tmp/all_kmods.txt)"

          while read -r name; do
            echo "CONFIG_PACKAGE_kmod-${name}=y" >> .config
          done < /tmp/all_kmods.txt

      - name: make defconfig (дозаполнение зависимостей)
        working-directory: openwrt-src
        run: make defconfig

      - name: Сохранить итоговый .config как артефакт (для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: full-config
          path: openwrt-src/.config
          include-hidden-files: true

      - name: Скачивание исходников всех выбранных пакетов
        working-directory: openwrt-src
        run: make download -j$(nproc)

      - name: Сборка прошивки
        working-directory: openwrt-src
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Загрузка собранных образов
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rpi4b-images
          path: |
            openwrt-src/bin/targets/bcm27xx/bcm2711/*
            openwrt-src/bin/packages/aarch64_cortex-a72/**
          if-no-files-found: warn

      - name: Загрузка логов сборки при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: openwrt-src/logs/
          if-no-files-found: ignore
