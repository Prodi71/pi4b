name: Build OpenWrt for Raspberry Pi 4 B verimag

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "Точная версия релиза OpenWrt, например 25.12.5"
        required: false
        default: "25.12.5"
  push:
    paths:
      - ".config"
      - ".github/workflows/build-openwrt.yml"

# Полная сборка OpenWrt может занимать 1–3 часа в зависимости от
# нагрузки на раннеры GitHub — увеличиваем лимит на всякий случай.
env:
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.5' }}
  OPENWRT_REF: v${{ github.event.inputs.openwrt_version || '25.12.5' }}
  BUILDINFO_URL: https://downloads.openwrt.org/releases/${{ github.event.inputs.openwrt_version || '25.12.5' }}/targets/bcm27xx/bcm2711/config.buildinfo

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout репозитория с .config
        uses: actions/checkout@v4

      - name: Установка зависимостей сборки OpenWrt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd

      - name: Клонирование исходников OpenWrt (${{ env.OPENWRT_REF }})
        run: |
          git clone --branch "${OPENWRT_REF}" --single-branch --depth 1 \
            https://github.com/openwrt/openwrt.git openwrt-src

      - name: Кэш скачанных исходников пакетов (dl)
        uses: actions/cache@v4
        with:
          path: openwrt-src/dl
          key: openwrt-dl-${{ env.OPENWRT_REF }}-${{ hashFiles('.config') }}
          restore-keys: |
            openwrt-dl-${{ env.OPENWRT_REF }}-

      - name: Обновление и установка feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Применение официального config.buildinfo (для совпадения vermagic)
        working-directory: openwrt-src
        run: |
          echo "Скачиваю официальный конфиг ядра релиза ${OPENWRT_VERSION}:"
          echo "  ${BUILDINFO_URL}"
          curl -fL -o .config "${BUILDINFO_URL}"

          echo
          echo "Добавляю поверх ваши пользовательские пакеты (kmod-* в вашем"
          echo "файле нет, поэтому конфиг ядра/vermagic этим не затрагивается):"
          cat ../.config >> .config

      - name: make defconfig (дозаполнение зависимостей)
        working-directory: openwrt-src
        run: make defconfig

      - name: Сохранить итоговый .config как артефакт (для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: full-config
          path: openwrt-src/.config
          include-hidden-files: true

      - name: Скачивание исходников всех выбранных пакетов
        working-directory: openwrt-src
        run: make download -j$(nproc)

      - name: Сборка прошивки
        working-directory: openwrt-src
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Загрузка собранных образов
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rpi4b-images
          path: |
            openwrt-src/bin/targets/bcm27xx/bcm2711/*
            openwrt-src/bin/packages/aarch64_cortex-a72/**
          if-no-files-found: warn

      - name: Загрузка логов сборки при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: openwrt-src/logs/
          if-no-files-found: ignore
